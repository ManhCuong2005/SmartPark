project_id = "smartpark"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.push-dispatch]
# The cron uses a dedicated, high-entropy secret checked inside the handler.
# The public publishable key and authenticated users cannot run this worker.
verify_jwt = false
