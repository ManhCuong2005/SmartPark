name: smartpark
description: SmartPark customer and staff apps with Supabase and offline parking operations.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.7.0
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.4
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  connectivity_plus: ^6.1.3
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.7
  qr_flutter: ^4.1.0
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqlite3: ^2.9.4
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/figma/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
