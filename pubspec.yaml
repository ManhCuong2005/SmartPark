name: smartpark
description: SmartPark customer app and automatic parking cameras with Supabase.
publish_to: none
version: 1.2.1+12002
environment:
  sdk: ^3.7.0
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.4
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  connectivity_plus: ^6.1.3
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  camera: ^0.11.2
  # Keep Android 6 support; 4.2.5 requires minSdk 24.
  flutter_tts: 4.2.3
  audioplayers: ^6.5.1
  shared_preferences: ^2.5.3
  web: ^1.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: 19.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqlite3: ^2.9.4
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/audio/scan_success.wav
    - assets/figma/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
