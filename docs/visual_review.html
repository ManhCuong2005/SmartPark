<!doctype html><html lang="vi"><meta charset="utf-8"><title>SmartPark · Figma / Flutter</title><style>body{font:15px system-ui;background:#eef2f7;color:#13243b;margin:24px}header{display:flex;gap:24px;align-items:center;flex-wrap:wrap}select{padding:10px}main{display:flex;gap:24px;align-items:start;margin-top:24px}figure{margin:0}img{width:390px;height:844px;display:block}figcaption{margin-bottom:10px;font-weight:600}.overlay{position:relative;width:390px;height:844px}.overlay img{position:absolute;inset:0}.overlay #over{opacity:.5}@media(max-width:900px){main{flex-wrap:wrap}}</style><header><strong>SmartPark · Đối chiếu thiết kế</strong><select id="screen"><optgroup label="01 · Khởi động và tài khoản"><option value="13_3">13_3</option><option value="13_25">13_25</option><option value="13_61">13_61</option><option value="13_96">13_96</option></optgroup><optgroup label="02 · Tìm bãi"><option value="13_139">13_139</option><option value="13_236">13_236</option><option value="13_333">13_333</option><option value="13_429">13_429</option></optgroup><optgroup label="03 · Đặt chỗ và vé"><option value="16_7">16_7</option><option value="16_73">16_73</option><option value="16_134">16_134</option><option value="16_176">16_176</option><option value="16_228">16_228</option></optgroup><optgroup label="04 · Tài khoản khách hàng"><option value="16_390">16_390</option><option value="16_451">16_451</option><option value="16_508">16_508</option><option value="16_590">16_590</option></optgroup><optgroup label="05 · Nhân viên"><option value="27_7">27_7</option><option value="27_42">27_42</option><option value="27_110">27_110</option><option value="27_144">27_144</option><option value="27_191">27_191</option></optgroup></select><label>Flutter overlay <input type="range" id="opacity" min="0" max="100" value="50"></label></header><p>Trái: Figma MCP · Giữa: Flutter tại 390 × 844 · Phải: chồng ảnh. Ảnh Flutter dùng safe area 34 px; thanh trạng thái hệ điều hành không nằm trong widget. Đây là ảnh kiểm tra, không phải assets giao diện.</p><main><figure><figcaption>Figma</figcaption><img id="ref"></figure><figure><figcaption>Flutter</figcaption><img id="actual"></figure><figure><figcaption>Overlay</figcaption><div class="overlay"><img id="under"><img id="over"></div></figure></main><script>const select=document.querySelector('#screen');function update(){const id=select.value;document.querySelector('#ref').src='figma/reference_'+id+'.png';document.querySelector('#under').src='figma/reference_'+id+'.png';document.querySelector('#actual').src='../test/goldens/'+id+'.png';document.querySelector('#over').src='../test/goldens/'+id+'.png';}select.onchange=update;document.querySelector('#opacity').oninput=e=>document.querySelector('#over').style.opacity=e.target.value/100;update();</script></html>
