name: Build signed Android artifacts (no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: android
      - name: Prepare signing files
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/smartpark-upload.jks
          python3 - <<'PY'
          import os
          from pathlib import Path
          def prop(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          Path('android/key.properties').write_text(
              'storeFile=../smartpark-upload.jks\n' + '\n'.join(
                  f'{key}={prop(os.environ[env])}' for key, env in [
                      ('storePassword', 'STORE_PASSWORD'), ('keyPassword', 'KEY_PASSWORD'), ('keyAlias', 'KEY_ALIAS')]
              ) + '\n', encoding='utf-8')
          PY
      - run: flutter pub get && flutter analyze && flutter test
      - name: Fastlane build only
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_OPT_OUT_USAGE: "true"
        run: bundle install && bundle exec fastlane android build_release
      - uses: actions/upload-artifact@v4
        with:
          name: smartpark-signed-builds
          path: build/signed/
          retention-days: 7
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/smartpark-upload.jks
