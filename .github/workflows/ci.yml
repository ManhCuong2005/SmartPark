name: SmartPark checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tools/prepare_web.dart
      - run: flutter build web --release
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          cache: true
      - run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"
      - run: flutter pub get
      - run: flutter build apk --debug --flavor customer -t lib/main.dart
      - run: flutter build apk --debug --flavor staff -t lib/main_staff.dart
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "true"
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: smartpark_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node tools/test_backend.mjs --url postgresql://postgres:test-only@127.0.0.1:5432/smartpark_test
