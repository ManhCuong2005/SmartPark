name: Build & Release SmartPark APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Configure Keystore for Release Signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare SQLite WASM & Web assets
        run: dart run tools/prepare_web.dart

      - name: Build Customer Split-per-ABI APKs
        run: flutter build apk --flavor customer -t lib/main.dart --release --split-per-abi

      - name: Build Staff Split-per-ABI APKs
        run: flutter build apk --flavor staff -t lib/main_staff.dart --release --split-per-abi

      - name: Archive APKs
        run: |
          mkdir -p release_apks
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.1.0"
          fi
          
          echo "=== Build output directory contents ==="
          ls -la build/app/outputs/flutter-apk/ || true

          # Copy tất cả các file apk build được vào thư mục release_apks
          for file in build/app/outputs/flutter-apk/*.apk; do
            if [ -f "$file" ]; then
              base=$(basename "$file")
              cp "$file" "release_apks/smartpark-${TAG_NAME}-${base}"
            fi
          done

          echo "=== Release APK Artifacts to upload ==="
          ls -la release_apks/

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SmartPark ${{ github.ref_name }}
          body: |
            ### Bản phát hành SmartPark ${{ github.ref_name }}
            
            #### 📱 Tập tin cài đặt APK cho Android:
            - **smartpark-${{ github.ref_name }}-customer.apk**: Dành cho Khách hàng (Tìm kiếm bãi đỗ, xem vị trí trống, đặt chỗ trước, vé điện tử và thanh toán VietQR).
            - **smartpark-${{ github.ref_name }}-staff.apk**: Dành cho Nhân viên bãi xe (Quét mã QR soát vé vào/ra, AI OCR nhận diện biển số, hỗ trợ hoạt động ngoại tuyến Offline-First).
            
            #### 🚀 Các tính năng & Cải tiến mới:
            - **Thanh toán VietQR Napas247**: Quét mã QR chuyển khoản động trực tiếp trên vé xe.
            - **Quick Duration Chips**: Chọn nhanh thời gian đỗ xe (+1h, +2h, +4h, +8h) với 1 chạm.
            - **Haptic Feedback**: Rung phản hồi khi quét thành công mã QR vé và nhận diện biển số OCR.
            - **AI OCR Việt Nam**: Tối ưu nhận diện biển số xe máy 2 dòng của Việt Nam.
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Khi chạy thủ công qua workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: smartpark-apks
          path: release_apks/*.apk
          retention-days: 14

