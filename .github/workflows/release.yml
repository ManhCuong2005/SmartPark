name: Build & Release SmartPark APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Configure Keystore for Release Signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare SQLite WASM & Web assets
        run: dart run tools/prepare_web.dart

      - name: Build Customer Split-per-ABI APKs
        run: flutter build apk --flavor customer -t lib/main.dart --release --split-per-abi

      - name: Build Staff Split-per-ABI APKs
        run: flutter build apk --flavor staff -t lib/main_staff.dart --release --split-per-abi

      - name: Archive APKs
        run: |
          mkdir -p release_apks
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.2.0"
          fi
          
          echo "=== Build output directory contents ==="
          ls -la build/app/outputs/flutter-apk/ || true

          # Tìm chính xác 2 file APK arm64-v8a hoặc file release bất kỳ của Customer và Staff
          CUSTOMER_APK=$(find build/app/outputs/flutter-apk -name "*customer*arm64*.apk" -o -name "*customer*release*.apk" | head -n 1)
          STAFF_APK=$(find build/app/outputs/flutter-apk -name "*staff*arm64*.apk" -o -name "*staff*release*.apk" | head -n 1)

          if [ -n "$CUSTOMER_APK" ] && [ -f "$CUSTOMER_APK" ]; then
            echo "Found Customer APK: $CUSTOMER_APK"
            cp "$CUSTOMER_APK" "release_apks/smartpark-${TAG_NAME}-customer.apk"
          fi

          if [ -n "$STAFF_APK" ] && [ -f "$STAFF_APK" ]; then
            echo "Found Staff APK: $STAFF_APK"
            cp "$STAFF_APK" "release_apks/smartpark-${TAG_NAME}-staff.apk"
          fi

          echo "=== Release APK Artifacts to upload (Only 2 APKs) ==="
          ls -la release_apks/

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SmartPark ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_v1.2.0.md
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Khi chạy thủ công qua workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: smartpark-apks
          path: release_apks/*.apk
          retention-days: 14

