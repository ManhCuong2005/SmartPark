<!doctype html><html lang="vi"><meta charset="utf-8"><title>SmartPark Admin · So sánh Figma</title><style>body{margin:24px;background:#f5f7fb;color:#13243b;font:14px system-ui}header{display:flex;gap:24px;align-items:center;flex-wrap:wrap}select{padding:10px}main{display:grid;gap:24px}figure{margin:0;overflow:auto}figcaption{margin:12px 0;font-weight:600}img{display:block;width:1440px;height:900px;max-width:none}.overlay{position:relative;width:1440px;height:900px}.overlay img{position:absolute;inset:0}#over{opacity:.5}</style><header><strong>SmartPark Admin · Figma / React</strong><select id="screen"><option value="overview" data-node="30_5">Tổng quan hệ thống</option><option value="parking" data-node="30_177">Quản lý bãi đỗ</option><option value="bookings" data-node="30_382">Quản lý đặt chỗ</option><option value="staff" data-node="30_553">Quản lý nhân viên</option><option value="reports" data-node="30_735">Báo cáo & doanh thu</option><option value="settings" data-node="30_894">Cài đặt & giá vé</option></select><label>Độ đậm bản React <input id="opacity" type="range" min="0" max="100" value="50"></label></header><p>Ảnh được render ở 1440 × 900. Giao diện thật có responsive, form nhập liệu và dữ liệu demo local. Ảnh tham chiếu chỉ dùng kiểm tra, không dùng làm giao diện chạy thực.</p><main><figure><figcaption>Figma</figcaption><img id="reference"></figure><figure><figcaption>React / TypeScript</figcaption><img id="actual"></figure><figure><figcaption>Chồng ảnh</figcaption><div class="overlay"><img id="under"><img id="over"></div></figure></main><script>const select=document.querySelector('#screen');function update(){const ref='figma/reference_'+select.selectedOptions[0].dataset.node+'.png',actual='screenshots/'+select.value+'.png';document.querySelector('#reference').src=ref;document.querySelector('#under').src=ref;document.querySelector('#actual').src=actual;document.querySelector('#over').src=actual;}select.onchange=update;document.querySelector('#opacity').oninput=e=>document.querySelector('#over').style.opacity=e.target.value/100;update();</script></html>
